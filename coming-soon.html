<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>支點運動空間｜訓練紀錄</title>
  <style>
    :root { --bg: #f2f6f5; --card: #ffffff; --text: #1a2321; --muted: #7a8280; --primary: #127a69; --selBg: #e5f2f0; --border: rgba(18,122,105,0.1); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border);
      border-radius: 22px; box-shadow: 0 8px 24px rgba(18,122,105,0.06); padding: 36px 24px 32px; text-align: center; }
    .icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%; background: var(--selBg);
      display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 36px; height: 36px; stroke: var(--primary); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 20px; font-weight: 900; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.7; color: var(--muted); margin: 0; text-wrap: balance; }
    .tag { display: inline-block; margin-top: 20px; padding: 5px 14px; border-radius: 999px;
      background: var(--selBg); color: #0d5c4f; font-size: 13px; font-weight: 900; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>
    </div>
    <h1>訓練紀錄</h1>
    <p>功能準備中，即將推出<br>敬請期待！</p>
    <span class="tag">支點運動空間</span>
  </div>
</body>
</html>
